    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "dtylab",
      "alternateName": "dtylab",
      "description": "dtylab is a platform for building and deploying AI agents.",
      "url": "https://dtylab.app",
      "applicationCategory": "WebApplication",
      "operatingSystem": "Web Browser",
      "offers": {

        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "AI agent development",
        "AI agent deployment",
        "AI agent management",
        "AI agent training",
        "AI agent evaluation",
        "AI agent monitoring",
        "AI agent optimization",
        "AI agent automation",
        "AI agent integration",
        "Excalidraw drawing support",
      ],
      "screenshot": "https://pic1.imgdb.cn/item/6929aaf5b4e23f08080b1788.png",

      ]
    }

    <script>
      (function() {
        const getInitialLanguage = () => {
          try {
            const stored = localStorage.getItem('i18nextLng');
            if (stored && (stored === 'zh' || stored === 'en')) {
              return stored;
            }
          } catch (e) {
            // localStorage not available
          }
          
          const browserLang = navigator.language || navigator.userLanguage || '';
          if (browserLang.startsWith('zh')) {
            return 'zh';
          }
          return 'en';
        };

        const translations = {
            zh: {
              title: 'dtylab - a platform for building and deploying AI agents',
            description: 'dtylab is a platform for building and deploying AI agents.',
            keywords: 'AI agents,AI agent platform,AI agent development,AI agent deployment,AI agent management,AI agent training,AI agent evaluation,AI agent monitoring,AI agent optimization,AI agent automation,AI agent integration'
          },
          en: {
            title: 'dtylab - a platform for building and deploying AI agents',
            description: 'dtylab is a platform for building and deploying AI agents.',
            keywords: 'AI agents,AI agent platform,AI agent development,AI agent deployment,AI agent management,AI agent training,AI agent evaluation,AI agent monitoring,AI agent optimization,AI agent automation,AI agent integration'
          }
        };

        const lang = getInitialLanguage();
        const t = translations[lang];
        const htmlLang = lang === 'zh' ? 'zh-CN' : 'en';

        document.documentElement.setAttribute('lang', htmlLang);
        document.title = t.title;

        const updateMeta = (selector, attr, value) => {
          const el = document.querySelector(selector);
          if (el) el.setAttribute(attr, value);
        };

        updateMeta('meta[name="description"]', 'content', t.description);
        updateMeta('meta[name="keywords"]', 'content', t.keywords);
        updateMeta('meta[property="og:title"]', 'content', t.title);
        updateMeta('meta[property="og:description"]', 'content', t.description);
        updateMeta('meta[name="twitter:title"]', 'content', t.title);
        updateMeta('meta[name="twitter:description"]', 'content', t.description);
      })();
    </script>

    <script>
      if (navigator.serviceWorker != null) {
        navigator.serviceWorker.register("sw.js").then(function (registration) {
          console.log("Registered events at scope: ", registration.scope);
        });
      }
    </script>
    <script type="systemjs-importmap">
      {
        "imports": {
          "react": "app:react",
          "react-dom": "app:react-dom"
        }
      }
    </script>
