[project]
name = "gitary-chat-agent"
version = "1.0.0"
description = "FastAPI server with Google ADK integration"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.19.0",
    "google-generativeai>=0.3.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "aiohttp>=3.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["hello_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
